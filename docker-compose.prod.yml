# Pinned explicitly: Compose otherwise names the project after the directory,
# and `--remove-orphans` would then treat containers of a neighbouring stack
# (the student frontend) as orphans of this one.
name: sttm-backend

services:
  backend:
    container_name: sttm_backend_prod
    # GITHUB_REPOSITORY=owner/repo, e.g. antongenso/sttm-server
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    # Lives next to this file on the server only — never committed. Compose
    # fails loudly if it is missing, which beats a container that starts and
    # then 500s on every database call.
    env_file:
      - .env
    # Published on loopback: nginx terminates TLS and proxies to it.
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod

networks:
  prod:
