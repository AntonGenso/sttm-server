services:
  backend:
    container_name: backend_dev
    # image: my-web-app:latest
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - ENV=development
    volumes:
      - ./backend:/app
      - ./backend/node_modules:/app/node_modules

  frontend:
    container_name: frontend_dev
    # image: my-web-app:latest
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - ENV=development
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    depends_on:
      - backend