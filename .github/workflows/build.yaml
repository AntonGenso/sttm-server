name: Package build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and push Docker image to ghcr.io
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://steptothemoon.uz/api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fails in seconds instead of after the image build, and names the secret
      # that is missing — the actions themselves only report "can't connect".
      - name: Check deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty secrets:$missing — add them under Settings → Secrets and variables → Actions, or to the 'production' environment used by this job."
            exit 1
          fi
          case "$SSH_PRIVATE_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "::error::SSH_PRIVATE_KEY does not look like a private key: it must include the -----BEGIN ... PRIVATE KEY----- and -----END ...----- lines."; exit 1 ;;
          esac
          echo "Deployment secrets are present."

      # The default buildx driver ("docker") cannot export a cache; this swaps
      # in the docker-container driver, which is what `type=gha` needs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      # No build-args: the app reads its configuration at runtime, and anything
      # baked in at build time would end up readable in the published layers.
      # Secrets live in ~/sttm-server/.env on the production server.
      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Its own directory: ~/sttm belongs to the student frontend, and two
      # stacks sharing a directory share a compose project — `--remove-orphans`
      # in one would tear down the containers of the other.
      - name: Copy compose file to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ~/sttm-server

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            set -e
            echo $GHCR_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd ~/sttm-server
            # ghcr.io rejects uppercase in image names.
            export GITHUB_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
