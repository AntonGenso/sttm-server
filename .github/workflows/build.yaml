name: Package build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The pipeline stops at ghcr: port 22 is firewalled off, so the production
# server pulls the new image itself (see scripts/deploy.sh, run from cron).
# Nothing here needs credentials for the server.
jobs:
  deploy:
    name: Build and push Docker image to ghcr.io
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://steptothemoon.uz/api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The default buildx driver ("docker") cannot export a cache; this swaps
      # in the docker-container driver, which is what `type=gha` needs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      # No build-args: the app reads its configuration at runtime, and anything
      # baked in at build time would end up readable in the published layers.
      # Secrets live in ~/sttm-server/.env on the production server.
      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
